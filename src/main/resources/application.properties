spring.application.name=vidratx

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vidratx}?serverTimezone=${VIDRATX_FUSO_HORARIO:America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

vidratx.jwt.secret=${JWT_SECRET}
vidratx.jwt.expiration=${JWT_EXPIRATION:PT1H}

vidratx.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
vidratx.cadastro-publico.habilitado=${CADASTRO_PUBLICO_HABILITADO:false}

springdoc.api-docs.enabled=${API_DOCS_HABILITADO:false}
springdoc.swagger-ui.enabled=${API_DOCS_HABILITADO:false}

vidratx.whatsapp.gateway-url=${WHATSAPP_GATEWAY_URL:http://localhost:3333}
vidratx.whatsapp.gateway-token=${WHATSAPP_GATEWAY_TOKEN:}
vidratx.whatsapp.midia-dir=${WHATSAPP_MIDIA_DIR:midia-whatsapp}
vidratx.whatsapp.max-tentativas=${WHATSAPP_MAX_TENTATIVAS:3}
vidratx.whatsapp.followup.horas-sem-resposta=${WHATSAPP_FOLLOWUP_HORAS:24}
vidratx.orcamento.dias-para-expirar=${ORCAMENTO_DIAS_PARA_EXPIRAR:15}
vidratx.whatsapp.gateway-connect-timeout=${WHATSAPP_GATEWAY_CONNECT_TIMEOUT:PT3S}
vidratx.whatsapp.gateway-read-timeout=${WHATSAPP_GATEWAY_READ_TIMEOUT:PT15S}
vidratx.whatsapp.conversa.inatividade-horas=${WHATSAPP_CONVERSA_INATIVIDADE_HORAS:24}
vidratx.whatsapp.conversa.inatividade-humano-horas=${WHATSAPP_CONVERSA_INATIVIDADE_HUMANO_HORAS:72}
vidratx.whatsapp.aviso-espera.intervalo=${WHATSAPP_AVISO_ESPERA_INTERVALO:PT5M}
vidratx.whatsapp.pergunta.max-tentativas=${WHATSAPP_PERGUNTA_MAX_TENTATIVAS:3}
vidratx.whatsapp.saida.max-tentativas=${WHATSAPP_SAIDA_MAX_TENTATIVAS:6}
vidratx.whatsapp.saida.validade-horas=${WHATSAPP_SAIDA_VALIDADE_HORAS:48}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

vidratx.alerta.webhook-url=${ALERTA_WEBHOOK_URL:}
vidratx.alerta.whatsapp-desconectado-minutos=${ALERTA_WHATSAPP_DESCONECTADO_MINUTOS:30}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
